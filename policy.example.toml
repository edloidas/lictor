[defaults]
execution = "automatic"
clone = "allowed"

# Investigate, reply, and ship code changes as branches and pull requests.
# `issues`, `merge`, `forcePush`, and `deleteBranches` stay denied until a
# later phase earns them.
[defaults.capabilities]
read = true
comment = true
branches = true
pullRequests = true
scripts = []

# Every repository is named in full. There are no owner wildcards here: an
# invitation grants reach, and only a line in this list grants permission.
[repositories]
allow = ["edloidas/lictor"]
deny = []

[repositories.overrides."edloidas/lictor"]
clone = "allowed"

[limits]
maxQueueDepth = 10000
maxJobAgeMinutes = 1440

[limits.costs]
maxAttempts = 3
maxDurationMinutes = 30

[repositories.overrides."edloidas/lictor".costs]
maxAttempts = 3
maxDurationMinutes = 30

[retention]
completedDays = 30
failedDays = 90
