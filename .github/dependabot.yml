version: 2

updates:
  # Actions are SHA-pinned for supply-chain safety, which makes them invisible
  # to any "is there a newer vX" signal. Dependabot rewrites the SHA and the
  # trailing `# vX.Y.Z` comment together, so the pins stay current without
  # anyone re-resolving them by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - improvement
    # One PR per week covering every action, not one PR per action. Action bumps
    # are almost always "new runner Node version, same inputs", so they review
    # and merge as a single unit — and one grouped PR burns one CI run, not N.
    groups:
      github-actions:
        patterns:
          - '*'

  # ! Must be `bun`, not `npm`. The npm updater rewrites `package.json` and
  # ! leaves `bun.lock` untouched, so every PR it opens lands with a stale
  # ! lockfile and dies on CI's `bun install --frozen-lockfile`.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - improvement
    # Mirrors `minimumReleaseAge` in bunfig.toml — without it Dependabot opens
    # PRs for versions the lockfile is not allowed to resolve.
    cooldown:
      default-days: 3
